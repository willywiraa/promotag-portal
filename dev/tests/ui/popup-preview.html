<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Popup preview</title></head>
<body style="margin:0;background:#F4F5F7">
<script src="chrome-stub.js"></script>
<script>
  // Renders the real popup.html (with the chrome.* stub above). Needs --allow-file-access-from-files.
  // &wide=1 adds the VM portal's web.css (the page fills the window), &pick=N picks tag N in the run
  // list, &log=1 opens the activity log. When done, window.__previewReady is true.
  // Under --virtual-time-budget, keep the page busy until it is ready, so real IndexedDB work finishes.
  (function keepAlive(n) {
    if (n <= 0 || window.__previewReady) return;
    let x = 0;
    for (let i = 0; i < 300000; i++) x += i % 7;
    window.__keepAliveSink = x;
    setTimeout(() => keepAlive(n - 1), 1);
  })(4000);

  const params = new URLSearchParams(location.search);
  const base = '../../../hybris-promotag-extension/popup/';
  const xhr = new XMLHttpRequest();
  xhr.open('GET', base + 'popup.html', false);
  xhr.send();
  const body = xhr.responseText
    .replace(/^[\s\S]*?<body[^>]*>/i, '')
    .replace(/<\/body>[\s\S]*$/i, '')
    .replace(/<script[^>]*popup\.js"[^>]*><\/script>/i, '') // started after the screenshots are stored
    .replace(/(src|href)="(?!https?:|#|data:)([^"]+)"/g, (m, attr, path) => `${attr}="${base}${path}"`);
  const vm = params.get('wide') ? '<link rel="stylesheet" href="../../../vm-portal/public/web.css">' : '';
  document.write(`<link rel="stylesheet" href="${base}popup.css">${vm}` + body);
</script>
<script>
  function fakeShot(code, rowText, color) {
    const c = document.createElement('canvas');
    c.width = 1280;
    c.height = 720;
    const g = c.getContext('2d');
    g.fillStyle = '#EEF1F5'; g.fillRect(0, 0, 1280, 720);
    g.fillStyle = '#1F2A44'; g.fillRect(0, 0, 1280, 48);
    g.fillStyle = '#FFFFFF'; g.font = 'bold 18px Segoe UI'; g.fillText('SAP Commerce Backoffice (preview)', 20, 31);
    g.fillRect(16, 64, 260, 640); g.fillRect(292, 64, 972, 300); g.fillRect(292, 380, 972, 324);
    g.fillStyle = '#334155'; g.font = '15px Segoe UI';
    ['Promotions', 'Promotion Tag', 'Promotion Tag Group'].forEach((t, i) => g.fillText(t, 32, 100 + i * 28));
    g.fillText('Tag Code', 312, 96); g.fillText('Tag', 520, 96);
    if (rowText) {
      g.fillStyle = color + '33'; g.fillRect(300, 112, 956, 34);
      g.strokeStyle = color; g.lineWidth = 3; g.strokeRect(300, 112, 956, 34);
      g.fillStyle = '#111827'; g.fillText(code, 312, 135); g.fillText(rowText, 520, 135);
    } else {
      g.fillStyle = color; g.fillText(`No result for Tag Code ${code}`, 312, 135);
    }
    return new Promise((resolve) => c.toBlob(resolve, 'image/webp', 0.9));
  }

  (async () => {
    const DB = PTAE.historyDb;
    const shots = window.__previewShots || [];
    for (const runId of new Set(shots.map((s) => s[0]))) {
      await DB.deleteRun(runId);
      await DB.createRun({ id: runId, startedAt: Date.now(), tagCode: runId.slice(4), operator: 'willy' });
    }
    for (const [runId, kind, code, text, color] of shots) {
      await DB.addScreenshot({ runId, kind, blob: await fakeShot(code, text, color), mime: 'image/webp', width: 1280, height: 720 });
    }
    const s = document.createElement('script');
    s.src = base + 'popup.js';
    s.onload = () => setTimeout(() => {
      window.dispatchEvent(new Event('ptae-preview-ready'));
      const pick = params.get('pick');
      if (pick != null) document.querySelector(`.tag-row[data-index="${pick}"]`).click();
      if (params.get('log')) document.getElementById('log-toggle').click();
      setTimeout(() => { window.__previewReady = true; }, 300);
    }, 200);
    document.body.append(s);
  })();
</script>
</body>
</html>
