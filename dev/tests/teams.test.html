<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Teams integration tests</title></head>
<body>
<script src="harness.js"></script>
<script src="../../hybris-promotag-extension/scripts/shared/alert-parser.js"></script>
<script src="../../hybris-promotag-extension/scripts/shared/batch.js"></script>
<script src="../../hybris-promotag-extension/scripts/shared/teams.js"></script>
<script>
  const T = PTAE.teams;
  const B = PTAE.batch;
  const BASE = 'https://backoffice.example.com/backoffice/';

  /** A batch run to the end: each arg is [code, newDesc, outcome?, resultExtra?]; no outcome = never ran. */
  function finished(...rows) {
    let b = B.createBatch({
      id: 'b1', operator: 'willy', confirmBeforeSave: true,
      items: B.normalizeItems(rows.map(([code, newDesc]) => ({ code, newDesc })), PTAE.parser).items,
    });
    rows.forEach(([, , outcome, extra], i) => {
      if (!outcome || b.items[i].status !== 'pending') return;
      b = B.startItem(b, i, { jobId: `j${i}`, runId: `r${i}` });
      b = B.applyResult(b, i, Object.assign({ outcome }, extra)).batch;
    });
    return b;
  }

  /** A minimal JPEG (JFIF header + frame header with the size), padded with `extra` bytes. */
  function fakeJpeg(width, height, extra = 0) {
    const head = [0xff, 0xd8, 0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00, 0x01, 0x01, 0x00, 0x00, 0x01, 0x00, 0x01, 0x00, 0x00,
      0xff, 0xc0, 0x00, 0x11, 0x08, height >> 8, height & 255, width >> 8, width & 255, 0x03, 1, 0x22, 0, 2, 0x11, 1, 3, 0x11, 1, 0xff, 0xd9];
    const b = new Uint8Array(head.length + extra);
    b.set(head);
    return b;
  }

  function fakePng(width, height) {
    const b = new Uint8Array(33);
    b.set([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a, 0, 0, 0, 13, 0x49, 0x48, 0x44, 0x52]);
    new DataView(b.buffer).setUint32(16, width);
    new DataView(b.buffer).setUint32(20, height);
    return b;
  }

  test('screenshot size read from JPEG and PNG headers; base64 for any length', () => {
    assertEqual(JSON.stringify(T.imageSize(fakeJpeg(1600, 900))), '{"width":1600,"height":900}');
    assertEqual(JSON.stringify(T.imageSize(fakePng(1280, 720))), '{"width":1280,"height":720}');
    assertEqual(T.imageSize(new Uint8Array([1, 2, 3])), null);
    assertEqual(T.imageSize(new TextEncoder().encode('not an image, just some text here')), null);
    const big = new Uint8Array(100000).map((_, i) => (i * 7) % 256);
    assertEqual(atob(T.toBase64(big)).length, big.length, 'round trip, chunked');
    assertEqual(T.toBase64(new Uint8Array([104, 105])), btoa('hi'));
  });

  test('reply with the updated tag\'s screenshot: the line, then the image inline (hostedContents)', () => {
    const b = finished(['963', '1 FOR 10% OFF, 2 FOR 25% OFF', 'success', { oldDesc: '2 FOR $83.40' }]);
    const jpeg = fakeJpeg(1600, 900, 50);
    const [{ payload }] = T.buildPayloads({ batch: b, images: { 963: { bytes: jpeg, contentType: 'image/jpeg' } } });
    assertEqual(payload.match, '963 ||');
    assertEqual(payload.message.body.content,
      '<p><b>963</b>&emsp;2 FOR $83.40 → 1 FOR 10% OFF, 2 FOR 25% OFF ✅</p>' +
      '<p><img src="../hostedContents/1/$value" alt="Tag 963 after the update" width="600" height="338"></p>');
    assertEqual(payload.message.hostedContents.length, 1);
    const hc = payload.message.hostedContents[0];
    assertEqual(hc['@microsoft.graph.temporaryId'], '1', 'matches the img src');
    assertEqual(hc.contentType, 'image/jpeg');
    assertEqual(hc.contentBytes, T.toBase64(jpeg));
    assertEqual(Object.keys(payload).join(','), 'source,version,match,message', 'the flow reads the same fields');
  });

  test('no screenshot to send → the line and a pointer to History; screenshots off → the line only', () => {
    const b = finished(['956', 'A', 'success', { oldDesc: 'B' }], ['959', 'C', 'failed', { code: 'NOT_FOUND', message: 'not found' }]);
    const on = T.buildPayloads({ batch: b, images: { 956: { bytes: fakeJpeg(10, 10, T.MAX_IMAGE_BYTES), contentType: 'image/jpeg' }, 959: { bytes: fakePng(8, 8), contentType: 'image/webp' } } });
    on.forEach(({ payload }) => {
      assertMatch(payload.message.body.content, /\(screenshot in the portal's History\)/, 'too large, or a type Teams may not show');
      assertEqual(payload.message.hostedContents, undefined);
    });
    const missing = T.buildPayloads({ batch: b, images: {} });
    assertMatch(missing[0].payload.message.body.content, /^<p><b>956<\/b>&emsp;B → A ✅<\/p><p><i>\(screenshot in the portal's History\)<\/i><\/p>$/);
    const off = T.buildPayloads({ batch: b });
    assertEqual(off[0].payload.message.body.content, '<p><b>956</b>&emsp;B → A ✅</p>');
    assertEqual(off[0].payload.message.hostedContents, undefined);
  });

  test('PNG screenshots go inline too, at their own size when narrow', () => {
    const msg = T.buildReply(finished(['956', 'A', 'success', { oldDesc: 'B' }]).items[0], { bytes: fakePng(400, 300), contentType: 'image/png' });
    assertMatch(msg.body.content, /width="400" height="300"/);
    assertEqual(msg.hostedContents[0].contentType, 'image/png');
  });

  test('link: built, read back and parsed into tags (documented example)', () => {
    const text = '956 || $10 OFF $99\n959 || $30 OFF $199';
    const url = T.importLink(BASE, text);
    assertEqual(url, `${BASE}#promotags=956%20%7C%7C%20%2410%20OFF%20%2499%0A959%20%7C%7C%20%2430%20OFF%20%24199`);
    const link = T.parseImportLink(url);
    assertEqual(link.text, text);
    assertEqual(link.cleanUrl, BASE, 'address bar without the tags');
    const items = PTAE.parser.parseAlerts(link.text).items;
    assertEqual(items.map((i) => `${i.code}=${i.desc}`).join(';'), '956=$10 OFF $99;959=$30 OFF $199');
  });

  test('link: form-encoded or unencoded text works; other fragments are ignored', () => {
    assertEqual(T.parseImportLink(`${BASE}#promotags=956+%7C%7C+%2410+OFF+%2499`).text, '956 || $10 OFF $99');
    assertEqual(T.parseImportLink(`${BASE}#promotags=956 || $10 OFF $99`).text, '956 || $10 OFF $99');
    assertEqual(T.parseImportLink(BASE), null);
    assertEqual(T.parseImportLink(`${BASE}#open=1`), null);
    assertEqual(T.parseImportLink(`${BASE}#promotags=`), null);
    assertEqual(T.parseImportLink(''), null);
  });

  test('link: whole card text with labels and "to change to" still yields the tags', () => {
    const card = 'Record 1\nAlert_Datetime Oct 22 2026 11:16AM\nAlert_Message 956 || to change to $10 OFF $99';
    const items = PTAE.parser.parseAlerts(T.parseImportLink(T.importLink(BASE, card)).text).items;
    assertEqual(items.length, 1);
    assertEqual(`${items[0].code}=${items[0].desc}`, '956=$10 OFF $99');
  });

  test('webhook URL: https only, kept verbatim, permission for its host', () => {
    const url = 'https://default1a2b.c3.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/abc/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Ab_cD-12';
    const hook = T.parseWebhookUrl(`  ${url} `);
    assertEqual(hook.url, url, 'signature untouched');
    assertEqual(hook.permission, 'https://default1a2b.c3.environment.api.powerplatform.com/*');
    assertEqual(T.parseWebhookUrl('http://example.com/x'), null, 'http');
    assertEqual(T.parseWebhookUrl('https://teams.microsoft.com/l/channel/19%3Aabc%40thread.tacv2/Daily?groupId=x'), null, 'Teams link');
    assertEqual(T.parseWebhookUrl('https://teams.cloud.microsoft/l/channel/x'), null, 'new Teams link');
    assertEqual(T.parseWebhookUrl('not a url'), null);
    assertEqual(T.parseWebhookUrl(''), null);
  });

  test('shouldPost: only when a tag reached Hybris', () => {
    assert(T.shouldPost(finished(['956', 'A', 'success'])), 'verified');
    assert(T.shouldPost(finished(['956', 'A', 'already-up-to-date'])), 'already set');
    assert(T.shouldPost(finished(['956', 'A', 'failed', { code: 'NOT_FOUND', message: 'Tag Code 956 not found in Hybris.' }])), 'tag problem');
    assert(!T.shouldPost(finished(['956', 'A', 'failed', { code: 'NETWORK', message: 'VPN' }], ['959', 'B'])), 'VPN down is not news');
    assert(!T.shouldPost(finished(['956', 'A', 'cancelled'])), 'skipped at confirm');
    assert(!T.shouldPost(null));
  });

  test('replies: one per tag that reached Hybris, under its own alert, short and without details', () => {
    const b = finished(
      ['956', '$10 OFF $99', 'failed', { code: 'TIMEOUT', message: 'Timed out after 8000 ms waiting for Promotion Tag tree node. Visible labels: Marketing' }],
      ['959', '$30 OFF $199', 'cancelled', { oldDesc: '2 FOR $82.00', message: 'Confirmation timed out — no changes made.' }],
      ['952', '3 FOR $89', 'success', { oldDesc: '2 FOR $79.50', verify: { attempts: 1 } }],
      ['957', '3 FOR $119', 'already-up-to-date', { oldDesc: '3 FOR $119' }]
    );
    const replies = T.buildPayloads({ batch: b });
    assertEqual(replies.map((r) => r.code).join(','), '956,952,957', 'skipped tag 959 gets no reply');
    assertEqual(replies.map((r) => r.payload.match).join(' | '), '956 || | 952 || | 957 ||', 'each under its own alert');
    assertEqual(replies.map((r) => r.payload.message.body.content).join('\n'), [
      '<p><b>956</b>&emsp;$10 OFF $99 ❌ failed</p>',
      '<p><b>952</b>&emsp;2 FOR $79.50 → 3 FOR $89 ✅</p>',
      '<p><b>957</b>&emsp;3 FOR $119 ✅ already set</p>',
    ].join('\n'));
    assert(replies.every((r) => r.payload.message.body.contentType === 'html' && r.payload.message.hostedContents === undefined), 'html, screenshots stay in History');
  });

  test('replies: the format from the Daily Alert thread', () => {
    const b = finished(
      ['964', '6 FOR $16.90', 'success', { oldDesc: '2 FOR $83.50' }],
      ['958', 'BUY 10 GET 10', 'success', { oldDesc: '2 FOR $81.50' }],
      ['960', 'MEMBER $89.90', 'success', { oldDesc: '2 FOR $82.40' }]
    );
    assertEqual(T.buildPayloads({ batch: b }).map((r) => `${r.payload.match} ${r.payload.message.body.content}`).join('\n'), [
      '964 || <p><b>964</b>&emsp;2 FOR $83.50 → 6 FOR $16.90 ✅</p>',
      '958 || <p><b>958</b>&emsp;2 FOR $81.50 → BUY 10 GET 10 ✅</p>',
      '960 || <p><b>960</b>&emsp;2 FOR $82.40 → MEMBER $89.90 ✅</p>',
    ].join('\n'));
  });

  // Guard: only a save that was read back from Hybris (outcome "success") or a value that was already
  // set may show ✅. Every other outcome replies "❌ failed" or not at all, with or without a screenshot.
  test('a failed or unverified save never produces a ✅ reply', () => {
    const shot = { bytes: fakeJpeg(1600, 900), contentType: 'image/jpeg' };
    const cases = [
      ['failed', { code: 'VERIFY', oldDesc: '10% OFF $80', message: 'Change not reflected after 3 retries — grid shows "10% OFF $80" (expected "10% OFF $70").', verify: { attempts: 4, observed: '10% OFF $80', matched: false } }, '❌'],
      ['failed', { code: 'SAVE', oldDesc: '10% OFF $80', message: 'Backoffice rejected the save: Tag exceeds 40 characters' }, '❌'],
      ['failed', { code: 'IDENTITY', message: 'Editor shows Tag Code "9560", expected "956" — aborting without changes.' }, '❌'],
      ['failed', { code: 'NOT_FOUND', message: 'Tag Code 956 not found in Hybris.' }, '❌'],
      ['failed', { code: 'AMBIGUOUS', message: 'Tag Code 956: 2 result rows show this code.' }, '❌'],
      ['failed', { code: 'TIMEOUT', message: 'Timed out after 30000 ms waiting for Promotion Tag tree node.' }, '❌'],
      ['failed', { message: 'No result.' }, '❌'],
      ['cancelled', { oldDesc: '10% OFF $80', message: 'Cancelled by operator — no changes made.' }, null],
      ['aborted', { code: 'ABORTED', oldDesc: '10% OFF $80', message: 'Stopped by operator.' }, null],
      ...['TAB', 'STALLED', 'SESSION', 'NETWORK'].map((code) => ['failed', { code, oldDesc: '10% OFF $80', message: `${code} after Save was clicked` }, null]),
    ];
    for (const [outcome, extra, expected] of cases) {
      const b = finished(['956', '10% OFF $70', outcome, extra]);
      const label = `${outcome}/${extra.code || '-'}`;
      assert(!/✅/.test(T.replyText(b.items[0])), `${label}: reply line`);
      for (const images of [undefined, { 956: shot }]) {
        const replies = T.buildPayloads({ batch: b, images });
        if (expected === null) {
          assertEqual(replies.length, 0, `${label}: no reply at all`);
          continue;
        }
        assertEqual(replies.length, 1, label);
        const content = replies[0].payload.message.body.content;
        assert(!/✅/.test(content), `${label}: no ✅ in ${content}`);
        assertMatch(content, /❌ failed/, label);
      }
    }
    // ✅ only where Hybris shows the new value: read back after saving, or already set before.
    const ok = finished(['956', '10% OFF $70', 'success', { oldDesc: '10% OFF $80', verify: { attempts: 1, observed: '10% OFF $70', matched: true } }]);
    assertMatch(T.buildPayloads({ batch: ok })[0].payload.message.body.content, /10% OFF \$80 → 10% OFF \$70 ✅<\/p>$/);
    const same = finished(['956', '10% OFF $70', 'already-up-to-date', { oldDesc: '10% OFF $70' }]);
    assertMatch(T.buildPayloads({ batch: same })[0].payload.message.body.content, /✅ already set<\/p>$/);
    ['pending', 'running', 'awaiting_confirm', 'failed', 'skipped', 'stopped'].forEach((status) => {
      assert(!/✅/.test(T.replyText({ code: '956', newDesc: 'A', oldDesc: 'B', status })), `status ${status}`);
    });
  });

  test('replies: none for environment failures (VPN, session) or tags that did not run', () => {
    const b = finished(['956', 'A', 'success', { oldDesc: 'B' }], ['959', 'C', 'failed', { code: 'NETWORK', message: 'VPN' }], ['960', 'D']);
    assertEqual(T.buildPayloads({ batch: b }).map((r) => r.code).join(','), '956');
  });

  test('reply: a stopped run lists the tags that did not run', () => {
    const b = finished(['956', 'A', 'success', { oldDesc: 'B' }], ['959', 'C', 'aborted', { code: 'ABORTED', message: 'Stopped by operator.' }], ['960', 'D']);
    assertEqual(b.items.map((it) => T.replyText(it)).join(' | '), 'B → A ✅ | C ⏭ not run | D ⏭ skipped');
  });

  test('reply: text from Hybris is escaped', () => {
    const html = T.buildReply(finished(['<b>9</b>', 'A & B', 'success', { oldDesc: '"x"' }]).items[0]).body.content;
    assertEqual(html, '<p><b>&lt;b&gt;9&lt;/b&gt;</b>&emsp;&quot;x&quot; → A &amp; B ✅</p>');
  });

  test('payloads: what the flow reads (match + Graph message), unchanged for the flow', () => {
    const [p] = T.buildPayloads({ batch: finished(['956', 'A', 'success', { oldDesc: 'B' }]) });
    assertEqual(Object.keys(p.payload).join(','), 'source,version,match,message');
    assertEqual(p.payload.match, '956 ||');
    assertEqual(p.payload.version, 1);
    assertEqual(p.payload.message.body.content, '<p><b>956</b>&emsp;B → A ✅</p>');
    const t = T.buildTestPayload({ operator: 'willy' });
    assertEqual(t.match, 'Daily Alert', 'test replies under the latest Daily Alert');
    assertMatch(t.message.body.content, /test reply from willy/);
    assertEqual(t.message.hostedContents, undefined);
    const withShot = T.buildTestPayload({ operator: 'willy', image: { bytes: fakeJpeg(1600, 900), contentType: 'image/jpeg' } });
    assertMatch(withShot.message.body.content, /to check that screenshots arrive:<\/p><p><img src="\.\.\/hostedContents\/1\/\$value"/);
    assertEqual(withShot.message.hostedContents.length, 1);
  });

  runTests();
</script>
</body>
</html>
