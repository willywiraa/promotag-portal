<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pipeline simulation tests</title></head>
<body>
<div id="app"></div>
<script src="harness.js"></script>
<script src="fixtures/backoffice-fixtures.js"></script>
<script src="fixtures/mock-backoffice.js"></script>
<script src="../../hybris-promotag-extension/scripts/zk-bridge.js"></script>
<script src="../../hybris-promotag-extension/scripts/zk-dom.js"></script>
<script src="../../hybris-promotag-extension/scripts/selectors.js"></script>
<script src="../../hybris-promotag-extension/scripts/content.js"></script>
<script>
  const M = MockBackoffice;
  const bridge = PTAE.dom.createBridgeClient();

  /** Fake service worker: records everything the engine sends and answers like background.js. */
  function makeTransport(opts = {}) {
    const t = { logs: [], stages: [], captures: [], confirmRequest: null, result: null, runner: null };
    t.send = async (type, p) => {
      switch (type) {
        case 'CS_LOG': t.logs.push(`${p.level}: ${p.msg}`); break;
        case 'CS_STAGE': t.stages.push({ stage: p.stage, data: p.data }); break;
        case 'CS_AWAIT_CONFIRM':
          t.confirmRequest = p;
          setTimeout(() => t.runner.confirm(opts.confirm !== false), 50);
          break;
        case 'CS_CAPTURE': {
          const lit = document.querySelectorAll('[style*="outline"]').length;
          t.captures.push({ kind: p.kind, highlighted: lit });
          return opts.captureFails ? { ok: false, error: 'blocked by test' } : { ok: true, id: `shot-${t.captures.length}` };
        }
        case 'CS_RESULT': t.result = p.result; break;
        default: break;
      }
      return { ok: true };
    };
    return t;
  }

  async function scenario(mockOpts, jobOpts, tOpts) {
    M.reset(mockOpts);
    const t = makeTransport(tOpts);
    const runner = PTAE.createRunner({ transport: t, bridge });
    t.runner = runner;
    const job = Object.assign({
      id: `job-${Math.random().toString(36).slice(2)}`,
      code: '895',
      newDesc: '10% OFF $70',
      roleName: 'WTCSG Backoffice User Role',
      confirmBeforeSave: true,
    }, jobOpts);
    await runner.run(job);
    return t;
  }

  const has = (t, re) => t.logs.some((l) => re.test(l));

  test('happy path: reads old value, confirms, saves, verifies on first search', async () => {
    const t = await scenario({ page: 'shell' });
    assertEqual(t.result && t.result.outcome, 'success', `result: ${JSON.stringify(t.result)} | ${t.logs.slice(-4).join(' / ')}`);
    assertEqual(t.result.oldDesc, '10% OFF $80', 'old value recorded');
    assertEqual(t.result.verify.attempts, 1);
    assertEqual(M.records[0].desc, '10% OFF $70', 'server model updated');
    assert(t.confirmRequest && t.confirmRequest.oldDesc === '10% OFF $80' && t.confirmRequest.newDesc === '10% OFF $70', 'confirm shows old → new');
    assert(has(t, /Current description in Hybris: "10% OFF \$80"/), 'old value logged');
    assert(has(t, /Backoffice: "Item 895 saved"/), 'save toast seen');
    assertEqual(t.captures.map((c) => c.kind).join(','), 'before,after');
    assert(t.captures.every((c) => c.highlighted > 0), 'evidence highlighted while capturing');
    assertEqual(document.querySelectorAll('[style*="outline"]').length, 0, 'highlight removed afterwards');
    assertEqual(M.log.filter((x) => x === 'search').length, 2, 'searched, then searched again to verify');
    assert(!M.log.includes('search-tag-written'), 'never wrote into the advanced-search "Tag" box');
    assert(t.stages.some((s) => s.stage === 'REVIEW' && s.data.oldDesc === '10% OFF $80'), 'old value persisted before saving');
  });

  test('starts from the role picker: selects WTCSG role and proceeds', async () => {
    const t = await scenario({ page: 'role' });
    assert(M.log.includes('role-proceed'), 'clicked Proceed');
    assertEqual(t.result && t.result.outcome, 'success', JSON.stringify(t.result));
  });

  const outcome = (t) => `result: ${JSON.stringify(t.result)} | ${t.logs.slice(-4).join(' / ')}`;
  const folderOpens = () => M.log.filter((x) => /^tree-(open|toggle)/.test(x));

  // The reported bug: "promotion" left the "Promotions" folder closed, and opening it failed on the
  // first tag of a run. The tree is filtered by Promotion Tag's own label now.
  test('first tag, fresh session: filters by "Promotion Tag" and opens it without touching a folder', async () => {
    const t = await scenario({ page: 'shell' });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assert(M.log.includes('tree-filter:Promotion Tag'), `filter text: ${M.log.filter((x) => x.startsWith('tree-filter')).join(',')}`);
    assertEqual(folderOpens().length, 0, 'no folder opened by the portal');
  });

  test('first tag, fresh session: Backoffice filters again 3 s and 5 s later → still opens Promotion Tag', async () => {
    const t = await scenario({ page: 'shell', latePasses: [3000, 5000] });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assert(has(t, /Promotion Tag tree node found/), 'node found');
  });

  test('filter matching word by word leaves "Promotions" closed → opened through ZK, then Promotion Tag', async () => {
    const t = await scenario({ page: 'shell', filterMode: 'anyWord' });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assertEqual(folderOpens().join(','), 'tree-open:Promotions', 'only the closed folder is opened');
    assert(has(t, /Opening "Promotions" in the tree/), 'logged');
  });

  test('the same without ZK\'s tree API → clicks the folder\'s expander', async () => {
    const t = await scenario({ page: 'shell', filterMode: 'anyWord', zkTreeApi: false });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assertEqual(folderOpens().join(','), 'tree-toggle:Promotions');
  });

  test('a later filter pass closes the opened folder again → opens it again, then by its expander', async () => {
    const t = await scenario({ page: 'shell', filterMode: 'anyWord', latePasses: [2000] });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assertEqual(folderOpens().join(','), 'tree-open:Promotions,tree-toggle:Promotions', 'retries alternate between ZK and the expander');
  });

  test('ZK\'s open does nothing on this Backoffice → the retry clicks the expander', async () => {
    M.reset({ page: 'shell', filterMode: 'anyWord' });
    const t = makeTransport();
    const runner = PTAE.createRunner({ transport: t, bridge });
    t.runner = runner;
    const realWidget = zk.Widget.$;
    zk.Widget.$ = (el) => {
      const w = realWidget(el);
      if (w && w.parent && w.parent.widgetName === 'treeitem') w.parent.setOpen = () => M.log.push('tree-open-ignored');
      return w;
    };
    try {
      await runner.run({ id: 'job-zk-noop', code: '895', newDesc: '10% OFF $70', roleName: 'WTCSG Backoffice User Role', confirmBeforeSave: true });
    } finally {
      zk.Widget.$ = realWidget;
    }
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assertEqual(M.log.filter((x) => /^tree-(open|toggle)/.test(x)).join(','), 'tree-open-ignored,tree-toggle:Promotions');
  });

  test('the Home dashboard refreshing in the background does not hold up the tree', async () => {
    const t = await scenario({ page: 'shell', latePasses: [3000], dashboardRefresh: { every: 700, latency: 250 } });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assertEqual(folderOpens().length, 0, 'no folder opened');
  });

  test('... nor the opening of a closed folder', async () => {
    const t = await scenario({ page: 'shell', filterMode: 'anyWord', latePasses: [3000], dashboardRefresh: { every: 500, latency: 400 } });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assert(folderOpens().length >= 1 && folderOpens().every((x) => /^tree-(open|toggle):Promotions$/.test(x)), folderOpens().join(','));
  });

  test('slow first tree filter (9 s) → waits for it instead of timing out', async () => {
    const t = await scenario({ page: 'shell', filterLatency: 9000 });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assert(!M.log.some((x) => /^tree-(open|toggle):Promotions/.test(x)), `no folder opened while the filter was loading: ${folderOpens().join(',')}`);
  });

  test('Promotion Tag already visible (folders left open) → clicked without filtering', async () => {
    const t = await scenario({ page: 'shell', treeOpen: ['Marketing', 'Promotions'] });
    assertEqual(t.result && t.result.outcome, 'success', outcome(t));
    assert(!M.log.some((x) => x.startsWith('tree-filter')), 'tree not filtered');
  });

  test('single-tag runs, each on a fresh session → every one succeeds', async () => {
    for (const [code, desc] of [['895', '10% OFF $70'], ['896', '3 FOR $25'], ['897', '2 FOR $9']]) {
      const t = await scenario({ page: 'shell', latePasses: [3000, 5000], records: [{ code, desc: 'OLD' }] }, { code, newDesc: desc });
      assertEqual(t.result && t.result.outcome, 'success', `${code}: ${outcome(t)}`);
      assertEqual(M.records[0].desc, desc, `${code} saved`);
    }
  });

  test('grid stale for 2 searches → verified on attempt 3', async () => {
    const t = await scenario({ page: 'shell', staleSearches: 2 });
    assertEqual(t.result.outcome, 'success', JSON.stringify(t.result));
    assertEqual(t.result.verify.attempts, 3);
    assert(has(t, /retry 1\/3 in 3 s/) && has(t, /retry 2\/3 in 5 s/), 'cooldowns logged');
  });

  test('never reflected → failed after 3 retries, final screenshot still taken', async () => {
    const t = await scenario({ page: 'shell', neverReflect: true });
    assertEqual(t.result.outcome, 'failed');
    assertEqual(t.result.code, 'VERIFY');
    assertEqual(t.result.verify.attempts, 4);
    assertMatch(t.result.message, /not reflected after 3 retries — grid shows "10% OFF \$80"/);
    assertEqual(t.captures[t.captures.length - 1].kind, 'after');
    assertEqual(M.log.filter((x) => x === 'save').length, 1, 'never saves twice');
  });

  test('already up to date → no confirm, no save', async () => {
    const t = await scenario({ page: 'shell', records: [{ code: '895', desc: '10% OFF $70' }] });
    assertEqual(t.result.outcome, 'already-up-to-date');
    assertEqual(t.confirmRequest, null);
    assert(!M.log.includes('save'), 'no save');
    assertEqual(t.captures.map((c) => c.kind).join(','), 'after');
  });

  test('cancel at confirm → nothing written', async () => {
    const t = await scenario({ page: 'shell' }, {}, { confirm: false });
    assertEqual(t.result.outcome, 'cancelled');
    assertEqual(M.records[0].desc, '10% OFF $80');
    assertEqual(document.querySelector('[data-role="desc"]').value, '10% OFF $80', 'field untouched');
    assert(!M.log.includes('save'), 'no save');
  });

  test('confirm off → saves without asking', async () => {
    const t = await scenario({ page: 'shell' }, { confirmBeforeSave: false });
    assertEqual(t.result.outcome, 'success');
    assertEqual(t.confirmRequest, null);
  });

  test('unknown code → "Tag Code 895 not found in Hybris."', async () => {
    const t = await scenario({ page: 'shell', records: [{ code: '123', desc: 'x' }] });
    assertEqual(t.result.outcome, 'failed');
    assertEqual(t.result.message, 'Tag Code 895 not found in Hybris.');
    assertEqual(t.captures.map((c) => c.kind).join(','), 'failure');
  });

  test('"contains" search with near matches picks the exact code', async () => {
    const t = await scenario({ page: 'shell', records: [{ code: '1895', desc: 'A' }, { code: '895', desc: '10% OFF $80' }, { code: '8950', desc: 'B' }] });
    assertEqual(t.result.outcome, 'success', JSON.stringify(t.result));
    assertEqual(M.records[1].desc, '10% OFF $70');
    assertEqual(M.records[0].desc, 'A', 'neighbour untouched');
    assertEqual(M.records[2].desc, 'B', 'neighbour untouched');
  });

  test('duplicate codes → ambiguous, aborted without changes', async () => {
    const t = await scenario({ page: 'shell', records: [{ code: '895', desc: 'A' }, { code: '895', desc: 'B' }] });
    assertEqual(t.result.code, 'AMBIGUOUS');
    assert(!M.log.includes('save'));
  });

  test('save rejected by Backoffice → failed with its message', async () => {
    const t = await scenario({ page: 'shell', saveFails: 'Tag exceeds 40 characters' });
    assertEqual(t.result.code, 'SAVE');
    assertMatch(t.result.message, /Tag exceeds 40 characters/);
  });

  test('session expired mid-job → logs the PRD message and re-runs SSO once', async () => {
    const t = await scenario({ page: 'login' }, { reachedShell: true, ssoAttempts: 0 });
    assertEqual(t.result, null, 'page is navigating; the next page load resumes the job');
    assert(has(t, /Hybris session expired\. Re-authenticate via SSO\./), 'PRD message logged');
    assert(t.stages.some((s) => s.stage === 'AWAIT_SSO' && s.data.ssoAttempts === 1), 'stage persisted before leaving');
    assert(M.log.includes('sso-click'), 'SSO link clicked');
  });

  test('session expired again after re-login → fails instead of looping', async () => {
    const t = await scenario({ page: 'login' }, { reachedShell: true, ssoAttempts: 2 });
    assertEqual(t.result.outcome, 'failed');
    assertEqual(t.result.message, 'Hybris session expired. Re-authenticate via SSO.');
  });

  test('network down → "Network Error: Verify GlobalProtect VPN connection."', async () => {
    const t = await scenario({ page: 'shell', networkDown: true });
    assertEqual(t.result.outcome, 'failed');
    assertEqual(t.result.message, 'Network Error: Verify GlobalProtect VPN connection.');
  });

  /** Runs several tags one after another in the same page, like a multi-tag run in the extension. */
  async function sequence(mockOpts, jobs, tOpts) {
    M.reset(mockOpts);
    const results = [];
    for (const j of jobs) {
      if (j.beforeRun) j.beforeRun();
      const t = makeTransport(tOpts);
      const runner = PTAE.createRunner({ transport: t, bridge });
      t.runner = runner;
      await runner.run(Object.assign({ id: `job-${Math.random().toString(36).slice(2)}`, roleName: 'WTCSG Backoffice User Role', confirmBeforeSave: true }, j.job));
      results.push(t);
    }
    return results;
  }

  const THREE = [{ code: '888', desc: '3 FOR $15.90' }, { code: '889', desc: '3 FOR $20' }, { code: '892', desc: '6 FOR $27.50' }];

  test('multi-tag run on a fresh session: the first tag and the later ones all succeed', async () => {
    const [a, b, c] = await sequence({ page: 'shell', records: THREE, latePasses: [3000, 5000] }, [
      { job: { code: '888', newDesc: '3 FOR $16.65' } },
      { job: { code: '889', newDesc: '3 FOR $23' } },
      { job: { code: '892', newDesc: '6 FOR $29.50' } },
    ]);
    [a, b, c].forEach((t, i) => assertEqual(t.result.outcome, 'success', `tag ${i + 1}: ${outcome(t)}`));
    assertEqual(M.records.map((r) => r.desc).join(' | '), '3 FOR $16.65 | 3 FOR $23 | 6 FOR $29.50');
    assert(has(a, /Promotion Tag tree node found/), 'first tag opened Promotion Tag from the tree');
    assert(has(b, /Promotion Tag is already open/) && has(c, /Promotion Tag is already open/), 'later tags reuse the open screen');
  });

  test('multi-tag run: three tags in a row, later tags reuse the open screen', async () => {
    const [a, b, c] = await sequence({ page: 'shell', records: THREE }, [
      { job: { code: '888', newDesc: '3 FOR $16.65' } },
      { job: { code: '889', newDesc: '3 FOR $23' } },
      { job: { code: '892', newDesc: '6 FOR $29.50' } },
    ]);
    [a, b, c].forEach((t, i) => assertEqual(t.result.outcome, 'success', `tag ${i + 1}: ${JSON.stringify(t.result)}`));
    assertEqual(M.records.map((r) => r.desc).join(' | '), '3 FOR $16.65 | 3 FOR $23 | 6 FOR $29.50');
    assertEqual(b.result.oldDesc, '3 FOR $20', 'second tag old value');
    assert(has(b, /Promotion Tag is already open/), 'second tag skipped the tree navigation');
    assert(!has(b, /Advanced search toggle found/), 'second tag did not toggle search mode again');
  });

  test('multi-tag run: a rejected save is reverted so the next tag still works', async () => {
    const [a, b] = await sequence({ page: 'shell', records: THREE }, [
      { job: { code: '888', newDesc: 'TOO LONG' }, beforeRun: () => { M.saveFails = 'Tag exceeds 40 characters'; } },
      { job: { code: '889', newDesc: '3 FOR $23' }, beforeRun: () => { M.saveFails = null; } },
    ]);
    assertEqual(a.result.code, 'SAVE');
    assert(has(a, /Put back the original value "3 FOR \$15.90"|Discarded the unsaved change/), 'first tag reverted its edit');
    assertEqual(M.records[0].desc, '3 FOR $15.90', 'first tag unchanged on the server');
    assertEqual(b.result.outcome, 'success', JSON.stringify(b.result));
    assert(!M.log.includes('unsaved-dialog'), 'no "unsaved changes" dialog');
  });

  test('without the revert, Backoffice would block the next tag (mock sanity check)', async () => {
    M.reset({ page: 'shell', records: THREE, treeFiltered: true, typeOpen: true, searchOpen: true });
    M.state.selected = '888'; // a previous tag left an unsaved edit behind
    M.state.dirty = 'unsaved edit';
    const t = makeTransport();
    const runner = PTAE.createRunner({ transport: t, bridge });
    t.runner = runner;
    await runner.run({ id: 'job-dirty', code: '889', newDesc: '3 FOR $23', confirmBeforeSave: false, roleName: 'WTCSG Backoffice User Role' });
    assertEqual(t.result.code, 'DIALOG', JSON.stringify(t.result));
    assert(M.log.includes('unsaved-dialog'), 'dialog shown');
  });

  test('screenshot blocked → run still succeeds with a warning', async () => {
    const t = await scenario({ page: 'shell' }, {}, { captureFails: true });
    assertEqual(t.result.outcome, 'success');
    assert(has(t, /Screenshot \(after\) unavailable: blocked by test/), 'warning logged');
  });

  runTests();
</script>
</body>
</html>
