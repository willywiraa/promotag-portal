<script src="harness.js"></script>
<script>
  /*
   * Loads the real service worker (background.js) into this page with a chrome.* stub and a fake
   * workflow URL, then checks the Teams reply and the "Open in Promo Tag Portal" links.
   */

  // --- chrome.* stub good enough to load the real service worker in a page ---------------------------
  const listeners = {};
  const ev = (name) => ({ addListener: (fn) => { (listeners[name] = listeners[name] || []).push(fn); } });
  const store = { local: {}, session: {} };
  const clone = (v) => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
  const area = (name) => ({
    async get(key) {
      const keys = key == null ? Object.keys(store[name]) : Array.isArray(key) ? key : [key];
      const o = {};
      keys.forEach((k) => { if (k in store[name]) o[k] = clone(store[name][k]); });
      return o;
    },
    async set(obj) { Object.assign(store[name], clone(obj)); },
    async remove(keys) { (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete store[name][k]); },
  });
  const calls = { tabsUpdate: [], openPopup: 0, badge: [], hooks: [] };
  let hookStatus = 202;
  let permitted = true;
  window.chrome = {
    runtime: { id: 'test', getURL: (p) => `chrome-extension://test/${p}`, onMessage: ev('onMessage'), onInstalled: ev('onInstalled'), onStartup: ev('onStartup') },
    storage: { local: area('local'), session: area('session') },
    alarms: { create: async () => {}, clear: async () => {}, onAlarm: ev('onAlarm') },
    tabs: {
      onRemoved: ev('tabs.onRemoved'), onUpdated: ev('tabs.onUpdated'), onCreated: ev('tabs.onCreated'),
      update: async (id, p) => { calls.tabsUpdate.push([id, p.url]); },
      query: async () => [], get: async () => ({}), sendMessage: async () => null,
    },
    action: {
      setBadgeText: async (o) => { calls.badge.push(o.text); },
      setBadgeBackgroundColor: async () => {},
      openPopup: async () => { calls.openPopup++; },
    },
    permissions: { contains: async () => permitted, request: async () => true, onAdded: ev('p.onAdded'), onRemoved: ev('p.onRemoved') },
    scripting: { getRegisteredContentScripts: async () => [], unregisterContentScripts: async () => {}, registerContentScripts: async () => {}, executeScript: async () => [] },
    windows: { get: async () => ({}), update: async () => {} },
  };
  window.importScripts = () => {}; // the shared scripts are loaded below with <script> tags

  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opts) => {
    if (String(url).startsWith('https://hook.example.com/')) {
      const body = JSON.parse(opts.body);
      calls.hooks.push({ url, body });
      return new Response(null, { status: typeof hookStatus === 'function' ? hookStatus(body) : hookStatus });
    }
    if (String(url).startsWith('chrome-extension://')) throw new TypeError('no extension files in this page');
    return realFetch(url, opts);
  };
</script>
<script src="../../hybris-promotag-extension/scripts/shared/auth-crypto.js"></script>
<script src="../../hybris-promotag-extension/scripts/shared/alert-parser.js"></script>

<script src="../../hybris-promotag-extension/scripts/auth-config.js"></script>
<script src="../../hybris-promotag-extension/scripts/background.js"></script>
<script>
  const BO = 'https://backoffice.example.com/backoffice/';
  const HOOK = 'https://hook.example.com/workflows/abc/triggers/manual/paths/invoke?api-version=1&sig=s3cr3t';
  const SENDER = { id: 'test', url: 'chrome-extension://test/popup/popup.html' };
  const AT = new Date(2026, 9, 22, 15, 8, 30).getTime(); // when the tags finished (local time)
  const BY = '<p>Run by willy via Promo Tag Portal · 22 Oct 2026, 15:08</p>';
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFor = async (fn, ms = 20000) => {
    const end = performance.now() + ms;
    while (performance.now() < end) {
      const v = await fn();
      if (v) return v;
      await pause(20);
    }
    throw new Error('timed out waiting');
  };

  /** Session (willy) + settings + a batch run by `operator` that finished at AT (each tag with a run id of its own). */
  async function prepare({ outcomes, webhook = HOOK, screenshots = true, operator = 'willy' }) {
    store.local = { settings: { baseUrl: BO, roleName: 'WTCSG Backoffice User Role', confirmBeforeSave: true, teamsWebhookUrl: webhook, teamsScreenshots: screenshots } };
    store.local.portalSession = await PTAE.authCrypto.createSession('willy', 60);
    store.session = {};
    calls.hooks = [];
    const id = `b${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
    let b = PTAE.batch.createBatch({
      id, operator, confirmBeforeSave: true,
      items: PTAE.batch.normalizeItems(outcomes.map(([code, newDesc]) => ({ code, newDesc })), PTAE.parser).items,
    });
    for (let i = 0; i < outcomes.length; i++) {
      const [, , outcome, extra] = outcomes[i];
      if (!outcome || b.items[i].status !== 'pending') continue;
      b = PTAE.batch.startItem(b, i, { jobId: `j${i}`, runId: `run-${id}-${i}` });
      b = PTAE.batch.applyResult(b, i, Object.assign({ outcome }, extra), AT).batch;
    }
    store.session.batch = clone(b);
    return b;
  }

  /** A minimal JPEG of the given size: distinct sizes make distinct images. */
  function fakeJpeg(width, height) {
    return new Uint8Array([0xff, 0xd8, 0xff, 0xe0, 0x00, 0x10, 0x4a, 0x46, 0x49, 0x46, 0x00, 0x01, 0x01, 0x00, 0x00, 0x01, 0x00, 0x01, 0x00, 0x00,
      0xff, 0xc0, 0x00, 0x11, 0x08, height >> 8, height & 255, width >> 8, width & 255, 0x03, 1, 0x22, 0, 2, 0x11, 1, 3, 0x11, 1, 0xff, 0xd9]);
  }

  /** Stores a run's screenshots in History, as the engine does during a run. */
  async function seedShots(item, shots) {
    await PTAE.historyDb.createRun({ id: item.runId, startedAt: Date.now(), tagCode: item.code, operator: 'willy' });
    for (const [kind, bytes] of shots) {
      await PTAE.historyDb.addScreenshot({ runId: item.runId, kind, blob: new Blob([bytes], { type: 'image/jpeg' }), mime: 'image/jpeg' });
      await pause(5); // distinct times: the latest of a kind wins
    }
  }

  const teamsState = async () => ((await chrome.storage.session.get('batch')).batch || {}).teams;

  const settled = () => waitFor(async () => { const s = await teamsState(); return s && s.status !== 'sending' && s; });

  test('run finishes → one short reply per tag, each under its own Daily Alert', async () => {
    hookStatus = 202;
    await prepare({ screenshots: false, outcomes: [
      ['964', '6 FOR $16.90', 'success', { oldDesc: '2 FOR $83.50', verify: { attempts: 1 } }],
      ['958', 'BUY 10 GET 10', 'already-up-to-date', { oldDesc: 'BUY 10 GET 10' }],
      ['960', 'MEMBER $89.90', 'cancelled', { oldDesc: '2 FOR $82.40' }],
    ] });
    await completeBatch();
    const t = await settled();
    assertEqual(t.status, 'sent', JSON.stringify(t));
    assertEqual(JSON.stringify(t.sent), '["964","958"]');
    assertEqual(calls.hooks.length, 2, 'one call per tag that reached Hybris; skipped 960 gets none');
    assert(calls.hooks.every((h) => h.url === HOOK), 'signed URL used verbatim');
    assertEqual(calls.hooks.map((h) => h.body.match).join(' | '), '964 || | 958 ||');
    assertEqual(calls.hooks.map((h) => h.body.message.body.content).join('\n'),
      `<p><b>964</b>&emsp;2 FOR $83.50 → 6 FOR $16.90 ✅</p>\n<p><b>958</b>&emsp;BUY 10 GET 10 ✅ already set</p>${BY}`, '"Run by" once, under the last reply');
    assert(calls.hooks.every((h) => h.body.message.hostedContents === undefined), 'no screenshots');
    assert((await chrome.storage.session.get('logs')).logs.some((l) => /Results sent to Teams: a reply under the Daily Alert of 964, 958/.test(l.msg)), 'logged');
    await completeBatch();
    await pause(200);
    assertEqual(calls.hooks.length, 2, 'never posted twice for one run');
  });

  test('each reply carries its own tag\'s updated screenshot from History', async () => {
    hookStatus = 202;
    const b = await prepare({ outcomes: [
      ['963', '1 FOR 10% OFF, 2 FOR 25% OFF', 'success', { oldDesc: '2 FOR $83.40' }],
      ['958', 'BUY 10 GET 10', 'already-up-to-date', { oldDesc: 'BUY 10 GET 10' }],
      ['960', 'MEMBER $89.90', 'failed', { code: 'NOT_FOUND', message: 'Tag Code 960 not found in Hybris.' }],
      ['961', 'X', 'success', { oldDesc: 'Y' }],
    ] });
    const shot = { before963: fakeJpeg(1601, 901), after963: fakeJpeg(1600, 900), after958: fakeJpeg(1280, 720), failure960: fakeJpeg(800, 600) };
    await seedShots(b.items[0], [['before', shot.before963], ['after', fakeJpeg(1599, 899)], ['after', shot.after963]]);
    await seedShots(b.items[1], [['after', shot.after958]]);
    await seedShots(b.items[2], [['failure', shot.failure960]]);
    // 961 has no screenshot (capture blocked)
    await completeBatch();
    const t = await settled();
    assertEqual(t.status, 'sent', JSON.stringify(t));
    assertEqual(calls.hooks.length, 4);
    const byCode = Object.fromEntries(calls.hooks.map((h) => [h.body.match.split(' ')[0], h.body.message]));
    const b64 = (bytes) => PTAE.teams.toBase64(bytes);
    assertEqual(byCode['963'].hostedContents[0].contentBytes, b64(shot.after963), '963: its latest after shot, not the before shot');
    assertEqual(byCode['963'].body.content, '<p><b>963</b>&emsp;2 FOR $83.40 → 1 FOR 10% OFF, 2 FOR 25% OFF ✅</p>' +
      '<p><img src="../hostedContents/1/$value" alt="Tag 963 after the update" width="600" height="338"></p>');
    assert(byCode['961'].body.content.endsWith(BY), 'the last reply of the card says who ran it');
    assertEqual(byCode['958'].hostedContents[0].contentBytes, b64(shot.after958), '958: its own screenshot');
    assertEqual(byCode['960'].hostedContents[0].contentBytes, b64(shot.failure960), '960: the failure screenshot');
    assertMatch(byCode['960'].body.content, /❌ failed/);
    assertEqual(byCode['961'].hostedContents, undefined, '961: no screenshot');
    assertMatch(byCode['961'].body.content, /\(screenshot in the portal's History\)/);
  });

  test('guard: an unverified save is reported ❌ failed (screenshot is not proof); a lost tab after Save gets no reply', async () => {
    hookStatus = 202;
    const b = await prepare({ outcomes: [
      ['971', 'NEW A', 'success', { oldDesc: 'OLD A', verify: { attempts: 1, observed: 'NEW A', matched: true } }],
      ['972', 'NEW B', 'failed', { code: 'VERIFY', oldDesc: 'OLD B', message: 'Change not reflected after 3 retries — grid shows "OLD B" (expected "NEW B").', verify: { attempts: 4, observed: 'OLD B', matched: false } }],
      ['973', 'NEW C', 'failed', { code: 'TAB', oldDesc: 'OLD C', message: 'Lost contact with the Backoffice tab after Save.' }],
    ] });
    await seedShots(b.items[0], [['after', fakeJpeg(1600, 900)]]);
    await seedShots(b.items[1], [['before', fakeJpeg(1601, 901)], ['after', fakeJpeg(1602, 902)]]); // red: not reflected
    await completeBatch();
    const t = await settled();
    assertEqual(t.status, 'sent', JSON.stringify(t));
    assertEqual(calls.hooks.map((h) => h.body.match).join(' | '), '971 || | 972 ||', '973 (environment failure) gets no reply');
    const [verified, unverified] = calls.hooks.map((h) => h.body.message);
    assertMatch(verified.body.content, /OLD A → NEW A ✅/);
    assert(!/✅/.test(JSON.stringify(unverified)), `no ✅ anywhere in the unverified reply: ${unverified.body.content}`);
    assertMatch(unverified.body.content, /<b>972<\/b>&emsp;OLD B → NEW B ❌ failed<\/p>/);
    assertEqual(unverified.hostedContents.length, 1, 'its screenshot is attached as evidence, not as proof of success');
  });

  test('screenshots switched off → the replies carry no image', async () => {
    hookStatus = 202;
    const b = await prepare({ screenshots: false, outcomes: [['963', 'A', 'success', { oldDesc: 'B' }]] });
    await seedShots(b.items[0], [['after', fakeJpeg(1600, 900)]]);
    await completeBatch();
    await settled();
    assertEqual(calls.hooks.length, 1);
    assertEqual(calls.hooks[0].body.message.body.content, `<p><b>963</b>&emsp;B → A ✅</p>${BY}`, 'a single tag is its card\'s last reply');
    assertEqual(calls.hooks[0].body.message.hostedContents, undefined);
  });

  test('"Run by": once per card, the user who started the run and the tag\'s finish time, also when Retry sends it later', async () => {
    hookStatus = (body) => (body.match === '959 ||' ? 500 : 202);
    await prepare({ operator: 'watsons', screenshots: false, outcomes: [['956', 'A', 'success', { oldDesc: 'B' }], ['959', 'C', 'success', { oldDesc: 'D' }]] });
    await chrome.storage.session.set({ batch: Object.assign(store.session.batch, {
      items: store.session.batch.items.map((it, i) => Object.assign(it, { finishedAt: AT + i * 60000 })),
    }) });
    await completeBatch();
    assertEqual((await settled()).status, 'failed');
    hookStatus = 202;
    await handleUi({ type: 'UI_TEAMS_RETRY' }, SENDER); // later, by willy (the portal login of this test)
    // 956 went out without the line (959, the card's last tag, carries it); 959 failed, then Retry sent it.
    assertEqual(calls.hooks.map((h) => `${h.body.match} ${(/<p>(Run by [^<]*)<\/p>$/.exec(h.body.message.body.content) || [0, '-'])[1]}`).join(' | '), [
      '956 || -',
      '959 || Run by watsons via Promo Tag Portal · 22 Oct 2026, 15:09',
      '959 || Run by watsons via Promo Tag Portal · 22 Oct 2026, 15:09',
    ].join(' | '));
  });

  /**
   * What the updated flow does with one request (TEAMS-SETUP.md, step 1, actions d to f): reply under the
   * newest post containing `match`; add `label` when that post holds none of the `later` tags.
   */
  function updatedFlow(posts, body) {
    const found = posts.filter((p) => JSON.stringify(p).includes(body.match)).sort((a, b) => (a.createdDateTime < b.createdDateTime ? -1 : 1));
    const target = found.length ? found[found.length - 1] : null;
    const laterHere = (body.later || []).filter((m) => (target ? JSON.stringify(target) : '').includes(m));
    const content = (body.content != null ? body.content : body.message.body.content) + (laterHere.length ? '' : body.label || '');
    return { thread: target ? target.id : 'new post', content, hostedContents: body.message.hostedContents };
  }

  test('updated flow: "Run by" once, under the last reply of each card, even when alert times mislead', async () => {
    hookStatus = (body) => (body.match === '1114 ||' ? 500 : 202);
    // The run of 27 Nov: two cards; the archive's times put 1117 in a minute of its own and 1116 with card A.
    await prepare({ operator: 'watsons', screenshots: false, outcomes: [
      ['1117', '$29 OFF $152', 'success', { oldDesc: 'Buy 2 Save $5' }],
      ['1116', '$18 OFF $102', 'success', { oldDesc: 'BUY 3 GET $12 OFF' }],
      ['1115', '$50 OFF $242', 'success', { oldDesc: 'BUY 2 GET $5 OFF' }],
      ['1114', '$35 OFF $182', 'success', { oldDesc: 'BUY 3 GET 12% OFF' }],
      ['1113', '$67 OFF $302', 'success', { oldDesc: 'BUY 2 GET 5%OFF' }],
    ] });
    const times = ['2026-11-27T11:55:01', '2026-11-27T11:54:58', '2026-11-27T11:54:20', '2026-11-27T11:54:20', '2026-11-27T11:54:20'];
    await chrome.storage.session.set({ batch: Object.assign(store.session.batch, {
      items: store.session.batch.items.map((it, i) => Object.assign(it, { alertAt: times[i] })),
    }) });
    const card = (id, at, codes) => ({ id, createdDateTime: at, attachments: [{ content: JSON.stringify({ body: codes.map((c) => ({ text: `${c} || new value` })) }) }] });
    const channel = [card('A', '2026-11-27T03:54:40Z', ['1113', '1114', '1115']), card('B', '2026-11-27T03:59:02Z', ['1116', '1117']), card('C', '2026-11-27T04:30:00Z', ['MT'])];
    await completeBatch();
    assertEqual((await settled()).status, 'failed', 'the flow refuses 1114 once');
    hookStatus = 202;
    await handleUi({ type: 'UI_TEAMS_RETRY' }, SENDER);
    const accepted = calls.hooks.filter((h) => h.body.match !== '1114 ||' || h !== calls.hooks.find((x) => x.body.match === '1114 ||'));
    const threads = {};
    accepted.forEach((h) => {
      const r = updatedFlow(channel, h.body);
      (threads[r.thread] = threads[r.thread] || []).push(`${h.body.match.split(' ')[0]}${/Run by watsons/.test(r.content) ? ' + Run by' : ''}`);
    });
    assertEqual(JSON.stringify(threads), JSON.stringify({ B: ['1117', '1116 + Run by'], A: ['1115', '1114', '1113 + Run by'] }));
    const first = calls.hooks[0].body;
    assertEqual(first.content, '<p><b>1117</b>&emsp;Buy 2 Save $5 → $29 OFF $152 ✅</p>', 'content: the reply without the line');
    assertEqual(first.label, '<p>Run by watsons via Promo Tag Portal · 22 Oct 2026, 15:08</p>');
    assertEqual(first.later.join(','), '1116 ||,1115 ||,1114 ||,1113 ||');
    assert(/Run by/.test(first.message.body.content), 'message: the old guess (1117 alone in its minute), for a flow not updated yet');
    // A flow that is not updated posts `message`: the line repeats as before, nothing is lost.
    assertEqual(calls.hooks.filter((h) => /Run by/.test(h.body.message.body.content)).length >= 2, true);
  });

  test('test button: the test reply carries the newest screenshot, to show that images arrive', async () => {
    hookStatus = 202;
    const b = await prepare({ outcomes: [['963', 'A', 'success', { oldDesc: 'B' }]] });
    const newest = fakeJpeg(1366, 768);
    await seedShots(b.items[0], [['after', newest]]);
    const resp = await handleUi({ type: 'UI_TEAMS_TEST' }, SENDER);
    assertEqual(resp.withScreenshot, true, JSON.stringify(resp));
    assertEqual(calls.hooks[0].body.match, 'Daily Alert');
    assertEqual(calls.hooks[0].body.message.hostedContents[0].contentBytes, PTAE.teams.toBase64(newest));
  });

  test('workflow refuses → failed with a fix-it message, nothing else tried; Retry then sends', async () => {
    hookStatus = 403;
    await prepare({ outcomes: [['956', '$10 OFF $99', 'success', { oldDesc: '$10 OFF $80' }], ['959', '$30 OFF $199', 'success', { oldDesc: 'X' }]] });
    await completeBatch();
    const t = await settled();
    assertEqual(t.status, 'failed');
    assertMatch(t.error, /Anyone/);
    assertEqual(JSON.stringify(t.pending), '["956","959"]');
    assertEqual(calls.hooks.length, 1, 'stopped at the first failure');
    hookStatus = 202;
    const resp = await handleUi({ type: 'UI_TEAMS_RETRY' }, SENDER);
    assertEqual(resp.ok, true, JSON.stringify(resp));
    const after = await teamsState();
    assertEqual(after.status, 'sent');
    assertEqual(JSON.stringify(after.pending), '[]');
    assertEqual(calls.hooks.length, 3);
  });

  test('a reply fails partway → Retry sends only the tags not sent yet', async () => {
    let failOnce = true;
    hookStatus = (body) => {
      if (body.match === '958 ||' && failOnce) {
        failOnce = false;
        return 500;
      }
      return 202;
    };
    await prepare({ outcomes: [['964', 'A', 'success', { oldDesc: 'a' }], ['958', 'B', 'success', { oldDesc: 'b' }], ['960', 'C', 'success', { oldDesc: 'c' }]] });
    await completeBatch();
    const t = await settled();
    assertEqual(t.status, 'failed');
    assertEqual(JSON.stringify(t.sent), '["964"]');
    assertEqual(JSON.stringify(t.pending), '["958","960"]');
    assert((await chrome.storage.session.get('logs')).logs.some((l) => /Teams reply not sent for 958, 960: The Teams workflow answered HTTP 500/.test(l.msg)), 'logged');
    const resp = await handleUi({ type: 'UI_TEAMS_RETRY' }, SENDER);
    assertEqual(resp.ok, true, JSON.stringify(resp));
    const after = await teamsState();
    assertEqual(after.status, 'sent');
    assertEqual(JSON.stringify(after.sent), '["964","958","960"]');
    assertEqual(calls.hooks.map((h) => h.body.match.split(' ')[0]).join(','), '964,958,958,960', '964 is never sent twice');
    hookStatus = 202;
  });

  test('nothing posted for VPN failures, or when Teams is not set up, or without access', async () => {
    await prepare({ outcomes: [['956', 'A', 'failed', { code: 'NETWORK', message: 'Network Error' }], ['959', 'B']] });
    await completeBatch();
    await pause(300);
    assertEqual(calls.hooks.length, 0, 'VPN failure');
    assertEqual(await teamsState(), undefined);

    await prepare({ outcomes: [['956', 'A', 'success', { oldDesc: 'B' }]], webhook: '' });
    await completeBatch();
    await pause(300);
    assertEqual(calls.hooks.length, 0, 'not configured');

    permitted = false;
    await prepare({ outcomes: [['956', 'A', 'success', { oldDesc: 'B' }]] });
    await completeBatch();
    const t = await settled();
    permitted = true;
    assertEqual(t.status, 'failed');
    assertMatch(t.error, /Grant access/);
    assertEqual(calls.hooks.length, 0);
  });

  test('test button: posts a test reply under the latest Daily Alert', async () => {
    hookStatus = 202;
    await prepare({ outcomes: [['956', 'A']] });
    const resp = await handleUi({ type: 'UI_TEAMS_TEST' }, SENDER);
    assertEqual(resp.ok, true, JSON.stringify(resp));
    assertEqual(calls.hooks.length, 1);
    assertEqual(calls.hooks[0].body.match, 'Daily Alert');
    assertMatch(calls.hooks[0].body.message.body.content, /test reply/);
  });

  test('settings: rejects a Teams link, keeps a flow URL, reports access', async () => {
    await prepare({ outcomes: [['956', 'A']] });
    const bad = await handleUi({ type: 'UI_SETTINGS_SAVE', settings: { teamsWebhookUrl: 'https://teams.microsoft.com/l/channel/19%3Ax%40thread.tacv2/D?groupId=1' } }, SENDER).catch((e) => ({ ok: false, error: e.message }));
    assertEqual(bad.ok, false);
    assertMatch(bad.error, /not a Teams link/);
    const ok = await handleUi({ type: 'UI_SETTINGS_SAVE', settings: { teamsWebhookUrl: ` ${HOOK} ` } }, SENDER);
    assertEqual(ok.settings.teamsWebhookUrl, HOOK);
    assertEqual(ok.access.teams, 'on');
    const off = await handleUi({ type: 'UI_SETTINGS_SAVE', settings: { teamsWebhookUrl: '' } }, SENDER);
    assertEqual(off.access.teams, 'off');
  });

  test('alert link: tags kept for the popup, address bar cleaned, popup opened once', async () => {
    await prepare({ outcomes: [['956', 'A']] });
    store.session = {};
    calls.tabsUpdate = [];
    calls.openPopup = 0;
    const url = `${BO}#promotags=956%20%7C%7C%20%2410%20OFF%20%2499%0A959%20%7C%7C%20%2430%20OFF%20%24199`;
    listeners['tabs.onCreated'].forEach((fn) => fn({ id: 7, pendingUrl: url }));
    await waitFor(async () => (await chrome.storage.session.get('pendingImport')).pendingImport);
    listeners['tabs.onUpdated'].forEach((fn) => fn(7, { url, status: 'loading' }, { id: 7, url }));
    await pause(300);
    const p = (await chrome.storage.session.get('pendingImport')).pendingImport;
    assertEqual(p.items.map((i) => `${i.code}=${i.desc}`).join(';'), '956=$10 OFF $99;959=$30 OFF $199');
    assertEqual(JSON.stringify(calls.tabsUpdate), JSON.stringify([[7, BO]]), 'tags removed from the address bar');
    assertEqual(calls.openPopup, 1, 'one click, one popup');
    assert(calls.badge.includes('NEW'), 'badge as fallback');

    const state = await handleUi({ type: 'UI_STATE' }, SENDER);
    assertEqual(state.pendingImport.items.length, 2, 'popup sees it');
    const taken = await handleUi({ type: 'UI_IMPORT_TAKE' }, SENDER);
    assertEqual(taken.import.items.length, 2);
    assertEqual((await handleUi({ type: 'UI_IMPORT_TAKE' }, SENDER)).import, null, 'taken once');
  });

  test('alert link: other sites and plain Backoffice URLs are ignored', async () => {
    await prepare({ outcomes: [['956', 'A']] });
    store.session = {};
    calls.openPopup = 0;
    await checkImportLink(8, 'https://evil.example.com/backoffice/#promotags=956%20%7C%7C%20X');
    await checkImportLink(9, `${BO}`);
    await checkImportLink(10, `${BO}#other=1`);
    assertEqual((await chrome.storage.session.get('pendingImport')).pendingImport, undefined);
    assertEqual(calls.openPopup, 0);
  });

  runTests({ realTimeIO: true });
</script>
