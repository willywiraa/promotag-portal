<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal Credential Hasher</title>
  <style>
    body { margin: 0; background: #F3F4F6; color: #111827; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { color: #6B7280; margin: 0 0 18px; }
    label { display: block; margin-bottom: 14px; font-weight: 600; font-size: 13px; }
    input { display: block; width: 100%; box-sizing: border-box; height: 38px; margin-top: 6px; padding: 0 10px; border: 1px solid #E5E7EB; border-radius: 8px; font: inherit; }
    button { width: 100%; height: 40px; border: 0; border-radius: 8px; background: #0066FF; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; }
    pre { white-space: pre-wrap; word-break: break-all; background: #0F172A; color: #E2E8F0; padding: 12px; border-radius: 8px; font: 12px/1.5 Consolas, monospace; min-height: 40px; }
    .err { color: #DC2626; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Portal Credential Hasher</h1>
    <p>Creates a user entry for <code>scripts/auth-config.js</code> → <code>users: [ … ]</code>. Runs entirely offline in this page; the password never leaves your machine. Use a portal access key, not an IT/AD password.</p>
    <form id="f">
      <label>User ID <input id="user" autocomplete="off" spellcheck="false" required></label>
      <label>Password / Access Key (min. 8 characters) <input id="pass" type="password" autocomplete="new-password" required></label>
      <label>Confirm <input id="pass2" type="password" autocomplete="new-password" required></label>
      <button id="go" type="submit">Generate entry</button>
    </form>
    <h3>Paste into <code>users: [ … ]</code></h3>
    <pre id="out"></pre>
  </main>
  <script src="../../hybris-promotag-extension/scripts/shared/auth-crypto.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const out = document.getElementById('out');
      const user = document.getElementById('user').value.trim();
      const pass = document.getElementById('pass').value;
      out.className = '';
      if (user.length < 3) { out.className = 'err'; out.textContent = 'User ID must be at least 3 characters.'; return; }
      if (pass.length < 8) { out.className = 'err'; out.textContent = 'Password must be at least 8 characters.'; return; }
      if (pass !== document.getElementById('pass2').value) { out.className = 'err'; out.textContent = 'Passwords do not match.'; return; }
      const btn = document.getElementById('go');
      btn.disabled = true;
      out.textContent = 'Hashing (PBKDF2-SHA256, 600,000 iterations)…';
      try {
        const rec = await PTAE.authCrypto.hashCredential(user, pass);
        out.textContent = JSON.stringify(rec, null, 2) + ',';
      } catch (err) {
        out.className = 'err';
        out.textContent = String(err);
      } finally {
        btn.disabled = false;
        document.getElementById('pass').value = '';
        document.getElementById('pass2').value = '';
      }
    });
  </script>
</body>
</html>
